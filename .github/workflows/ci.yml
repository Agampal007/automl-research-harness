name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      # The test suite drives the loop with scikit-learn models on CPU, so it
      # needs neither PyTorch nor a model backend.
      - run: pip install numpy scikit-learn matplotlib pytest
      - run: pytest -q
