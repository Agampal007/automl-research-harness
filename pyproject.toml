[project]
name = "automl-research-harness"
version = "0.1.0"
description = "An LLM researcher that proposes, runs and validates ML experiments unattended."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scikit-learn",
    "matplotlib",
    "lightgbm",
    "torch",
    "openai",
    "anthropic",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
